name: Build companion binaries

# Produces the double-click companion apps (no Python needed by end users).
# Runs when you push a tag like v1.0.0, and attaches the binaries to the
# GitHub Release so the device's setup page can link to them at
# /releases/latest/download/YoyuCompanion-<os>[.exe].

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            ext: ".exe"
            asset: YoyuCompanion-windows.exe
            cli_asset: YoyuCompanion-cli-windows.exe
            gui_deps: ""
            tray_backend: pystray._win32
          - os: macos-latest
            ext: ""
            asset: YoyuCompanion-macos
            cli_asset: YoyuCompanion-cli-macos
            gui_deps: "pyobjc-framework-Cocoa"
            tray_backend: pystray._darwin
          - os: ubuntu-latest
            ext: ""
            asset: YoyuCompanion-linux
            cli_asset: YoyuCompanion-cli-linux
            gui_deps: "python-xlib"
            tray_backend: pystray._xorg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # certifi -> bundled CA store (fixes macOS TLS); pystray/pillow -> the tray UI.
      - run: pip install pyinstaller certifi pystray pillow ${{ matrix.gui_deps }}
      - name: Build the tray app (double-click) and the headless CLI
        working-directory: companion
        shell: bash
        run: |
          # YoyuCompanion = the friendly tray app (shows a menubar/tray icon).
          pyinstaller --onefile --name YoyuCompanion --noconsole \
            --hidden-import "${{ matrix.tray_backend }}" \
            --collect-submodules PIL tray.py
          # YoyuCompanion-cli = the headless companion (servers / debugging).
          pyinstaller --onefile --name YoyuCompanion-cli companion.py
          cd dist
          mv "YoyuCompanion${{ matrix.ext }}" "${{ matrix.asset }}"
          mv "YoyuCompanion-cli${{ matrix.ext }}" "${{ matrix.cli_asset }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: companion/dist/${{ matrix.asset }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.cli_asset }}
          path: companion/dist/${{ matrix.cli_asset }}

      # Linux gets native packaging as well as the bare binary. Neither format
      # meets a security gate the way an unsigned Windows or macOS build does,
      # so this is the one platform where packaging is a straight win.
      - name: Build the .deb and the AppImage
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          # A tag build names itself after the tag. A workflow_dispatch build
          # has no tag, so it falls back to the firmware version, which is what
          # the release would have been called anyway.
          TAG="${GITHUB_REF#refs/tags/}"
          case "$GITHUB_REF" in
            refs/tags/*) VER="${TAG#v}" ;;
            *) VER="$(sed -n 's/.*FW_VERSION = "\([0-9.]*\)".*/\1/p' \
                        firmware/src/main.cpp | head -1)" ;;
          esac
          [ -n "$VER" ] || VER="0.0.0"
          echo "Packaging version $VER"
          # appstream so the build scripts can report what is wrong with the
          # metadata; appimagetool only says that validation failed.
          sudo apt-get install -y appstream >/dev/null 2>&1 || true
          chmod +x packaging/linux/*.sh
          packaging/linux/build-deb.sh "$VER" \
            companion/dist/YoyuCompanion-linux \
            companion/dist/YoyuCompanion-cli-linux \
            companion/dist
          packaging/linux/build-appimage.sh "$VER" \
            companion/dist/YoyuCompanion-linux \
            companion/dist
          ls -l companion/dist
      - name: Check the .deb is well formed and installs
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          DEB=$(ls companion/dist/*.deb)
          sudo apt-get install -y lintian desktop-file-utils >/dev/null 2>&1 || true
          # lintian is advisory here; a packaging warning should not fail a
          # release, but it should be visible in the log. The two that remain
          # are hardening-no-pie and no-manual-page, both inherent to a
          # PyInstaller binary rather than anything this packaging chose.
          lintian "$DEB" || true
          # This is the part that matters: it has to actually install, put the
          # binaries where the desktop entry says, and remove cleanly.
          sudo dpkg -i "$DEB"
          test -x /usr/bin/yoyu-companion
          test -x /usr/bin/yoyu-companion-cli
          test -f /usr/share/applications/yoyu-companion.desktop
          test -f /usr/share/icons/hicolor/256x256/apps/yoyu-companion.png
          test -f /usr/share/metainfo/io.github.daveeuson.YoyuCompanion.metainfo.xml
          appstreamcli validate --no-net \
            /usr/share/metainfo/io.github.daveeuson.YoyuCompanion.metainfo.xml
          test -f /usr/share/doc/yoyu-companion/changelog.gz
          desktop-file-validate /usr/share/applications/yoyu-companion.desktop
          # A packaged copy must not offer to install itself somewhere else.
          # Asserted against a real installed .deb, because the branch that
          # decides this reads sys.executable and only a real install has the
          # right one.
          # Capture first, then inspect. Piping this straight into grep looks
          # right and is not: the step runs under pipefail, and --install is
          # meant to fail here, so the pipeline reports that failure however
          # well grep did.
          set +e
          OUT=$(yoyu-companion-cli --install 2>&1)
          RC=$?
          set -e
          echo "$OUT"
          [ "$RC" -ne 0 ] || { echo "::error::--install should have refused"; exit 1; }
          echo "$OUT" | grep -q "package manager" \
            || { echo "::error::refusal did not explain why"; exit 1; }
          sudo dpkg -r yoyu-companion
          test ! -e /usr/bin/yoyu-companion
          test ! -e /usr/share/applications/yoyu-companion.desktop
      - name: Check the AppImage is well formed
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          APP=$(ls companion/dist/*.AppImage)
          cd "$(dirname "$APP")"
          # No FUSE on a runner, so unpack it rather than mounting it. This
          # still proves the payload, the desktop entry and the icon are all
          # where the runtime expects them.
          "./$(basename "$APP")" --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          test -x squashfs-root/usr/bin/yoyu-companion
          test -f squashfs-root/yoyu-companion.desktop
          test -f squashfs-root/yoyu-companion.png
          desktop-file-validate squashfs-root/yoyu-companion.desktop
          rm -rf squashfs-root
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: linux-packages
          path: |
            companion/dist/*.deb
            companion/dist/*.AppImage

  # Flash images for the browser flasher (docs/ ESP Web Tools page).
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install platformio esptool
      - name: Check FW_VERSION matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: firmware
        run: |
          # A tag created from a stale local commit ships firmware that reports
          # the wrong version (and the flasher then advertises a build that
          # doesn't match). Fail before spending a build on it.
          TAG="${GITHUB_REF#refs/tags/v}"
          FW=$(sed -n 's/.*FW_VERSION *= *"\([^"]*\)".*/\1/p' src/main.cpp | head -1)
          echo "tag=$TAG firmware=$FW"
          if [ "$TAG" != "$FW" ]; then
            echo "::error::Tag v$TAG does not match FW_VERSION $FW in src/main.cpp."
            echo "::error::Either bump FW_VERSION or tag the commit that has it"
            echo "::error::(git tag v$FW origin/main)."
            exit 1
          fi
      - name: Build firmware
        working-directory: firmware
        run: pio run
      - name: Assemble flash images
        working-directory: firmware
        run: |
          BOOT_APP0=$(find ~/.platformio/packages/framework-arduinoespressif32 -name boot_app0.bin | head -1)
          mkdir -p out
          # $1 = PlatformIO env, $2 = release asset prefix, $3 = chip family.
          # The env and the prefix differ on purpose for the LCD board: its
          # assets stay named headroom-mini-* because boards in the field fetch
          # those exact names for OTA, and renaming them would 404 every one of
          # them. The chip is an argument because the C6 is not an S3, and
          # merge_bin stamps a header the ROM loader checks.
          assemble() {
            B=".pio/build/$1"
            # Individual parts. The flasher writes these at their offsets and
            # skips the NVS region (0x9000), so saved Wi-Fi / pairing / settings
            # survive an update.
            cp "$B/bootloader.bin" "out/$2-bootloader.bin"
            cp "$B/partitions.bin" "out/$2-partitions.bin"
            cp "$BOOT_APP0"        "out/$2-boot_app0.bin"
            cp "$B/firmware.bin"   "out/$2-app.bin"
            # Single full-flash image for esptool / manual users.
            esptool.py --chip "$3" merge_bin \
              --flash_mode keep --flash_freq keep --flash_size keep \
              -o "out/$2-merged.bin" \
              0x0     "$B/bootloader.bin" \
              0x8000  "$B/partitions.bin" \
              0xe000  "$BOOT_APP0" \
              0x10000 "$B/firmware.bin"
          }
          assemble headroom-mini  headroom-mini  esp32s3
          assemble yoyu-amoled216 yoyu-amoled    esp32s3
          assemble yoyu-c6lcd147  yoyu-c6lcd147  esp32c6

      - name: Refuse to publish an image built for the wrong board
        working-directory: firmware
        run: |
          # Each image must reference its own OTA asset and no other. The two
          # envs shared a source file for a while, and the AMOLED one compiled
          # LCD firmware with a flag nothing read -- byte-different thanks to
          # embedded build metadata, identical in behaviour. Publishing that
          # hands someone an image that cannot drive their panel, and the
          # release stays green while doing it.
          #
          # Checked on the baked-in URL rather than a hash, because that is the
          # property that matters: both images are validly signed, so a board
          # will accept the wrong one if it ever asks for it.
          PFXS="headroom-mini yoyu-amoled yoyu-c6lcd147"
          for want in $PFXS; do
            if ! grep -qa "$want-app.bin" "out/$want-app.bin"; then
              echo "::error::out/$want-app.bin does not reference $want-app.bin --"
              echo "::error::it was built for a different board. Check"
              echo "::error::OTA_ASSET_PREFIX in firmware/src/boards.h."
              exit 1
            fi
            # ...and no other board's. Every pair, rather than the single pair
            # that had gone wrong once: a third board makes six ways to ship an
            # image a board will accept and cannot run.
            for other in $PFXS; do
              [ "$other" = "$want" ] && continue
              if grep -qa "$other-app.bin" "out/$want-app.bin"; then
                echo "::error::out/$want-app.bin also references $other-app.bin, so a"
                echo "::error::$want board could fetch and accept $other firmware."
                exit 1
              fi
            done
          done
          echo "Each image references only its own OTA asset."
      - name: Sign the OTA app image (C2)
        working-directory: firmware
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          # The board verifies this signature against its embedded public key
          # before flashing an OTA image. Signature-checking firmware refuses an
          # unsigned image, so a release MUST carry a valid .sig — hard-fail if
          # the signing key isn't configured rather than ship an un-updatable build.
          if [ -z "$OTA_SIGNING_KEY" ]; then
            echo "::error::OTA_SIGNING_KEY secret is not set. Add the EC P-256"
            echo "::error::private key as a *repository* secret (Settings -> Secrets"
            echo "::error::and variables -> Actions) before tagging a release."
            exit 1
          fi
          # Strip CR: a key pasted from a Windows terminal carries CRLF endings,
          # which openssl won't parse ("Could not read private key").
          printf '%s\n' "$OTA_SIGNING_KEY" | tr -d '\r' > ota_priv.pem
          if ! openssl pkey -in ota_priv.pem -noout 2>/dev/null; then
            echo "::error::OTA_SIGNING_KEY is set but is not a readable PEM private key."
            echo "::error::It was most likely mangled by copy/paste (line breaks lost)."
            echo "::error::Set it straight from the file instead of pasting:"
            echo "::error::  gh secret set OTA_SIGNING_KEY --repo <owner>/<repo> < headroom-ota-key.pem"
            exit 1
          fi
          # The signing key MUST match the public key compiled into the firmware.
          # Verifying only against the private key's own public half would pass
          # even on a mismatch, and every board would then silently refuse the
          # update — a release that looks green but can never be installed.
          sed -n '/BEGIN PUBLIC KEY/,/END PUBLIC KEY/p' src/ota_pubkey.h > embedded_pub.pem
          openssl pkey -in ota_priv.pem -pubout -out signing_pub.pem 2>/dev/null
          if ! cmp -s embedded_pub.pem signing_pub.pem; then
            echo "::error::OTA_SIGNING_KEY does not match firmware/src/ota_pubkey.h."
            echo "::error::Boards would reject this update. Either set the secret to the"
            echo "::error::private key matching the embedded public key, or commit the"
            echo "::error::public key derived from the current secret."
            exit 1
          fi
          # Every board's image. One without a .sig is un-installable on
          # firmware that checks signatures, which is all of it.
          for pfx in headroom-mini yoyu-amoled yoyu-c6lcd147; do
            openssl dgst -sha256 -sign ota_priv.pem \
              -out "out/$pfx-app.bin.sig" "out/$pfx-app.bin"
            openssl dgst -sha256 -verify embedded_pub.pem \
              -signature "out/$pfx-app.bin.sig" "out/$pfx-app.bin"
          done
          shred -u ota_priv.pem 2>/dev/null || rm -f ota_priv.pem
          ls -l out/*.sig
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-images
          path: firmware/out/*

  release:
    needs: [build, firmware]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Hash everything that gets published
        run: |
          # Nothing here is code-signed, so Windows Defender and macOS
          # Gatekeeper both treat the downloads as unknown. Anyone who wants to
          # add an antivirus exclusion needs a way to tell the real file from a
          # substituted one first, and this is it. Names only, no paths, so
          # `sha256sum -c` works from wherever the files were downloaded to.
          cd dist
          find . -maxdepth 1 -type f -printf '%P\n' | sort \
            | xargs sha256sum > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt .
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
      - name: Verify the published release has every expected asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release that publishes with assets missing looks green but leaves
          # users on the previous version (or with no signed OTA image). Assert
          # the ones that matter are actually attached.
          TAG="${GITHUB_REF#refs/tags/}"
          ASSETS=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
                     --json assets --jq '.assets[].name')
          echo "$ASSETS"
          MISSING=0
          for want in headroom-mini-app.bin headroom-mini-app.bin.sig \
                      headroom-mini-bootloader.bin headroom-mini-partitions.bin \
                      headroom-mini-boot_app0.bin headroom-mini-merged.bin \
                      yoyu-amoled-app.bin yoyu-amoled-app.bin.sig \
                      yoyu-amoled-bootloader.bin yoyu-amoled-partitions.bin \
                      yoyu-amoled-boot_app0.bin yoyu-amoled-merged.bin \
                      yoyu-c6lcd147-app.bin yoyu-c6lcd147-app.bin.sig \
                      yoyu-c6lcd147-bootloader.bin yoyu-c6lcd147-partitions.bin \
                      yoyu-c6lcd147-boot_app0.bin yoyu-c6lcd147-merged.bin \
                      YoyuCompanion-windows.exe YoyuCompanion-macos \
                      YoyuCompanion-linux SHA256SUMS.txt \
                      yoyu-companion_amd64.deb \
                      YoyuCompanion-x86_64.AppImage; do
            if ! echo "$ASSETS" | grep -qx "$want"; then
              echo "::error::Release $TAG is missing asset: $want"
              MISSING=1
            fi
          done
          [ "$MISSING" -eq 0 ] || exit 1
          echo "All expected assets present on $TAG."

  # No pages job here on purpose. This workflow used to redeploy the flasher
  # itself, from its own build artifact, while pages.yml deployed the same site
  # from releases/latest. Two deployers reading two different sources raced on
  # every release: a docs push during a release bundles the *previous* firmware
  # (releases/latest lags until the release is published) and can land last, so
  # the flasher installs the old version while the release page advertises the
  # new one. Both runs stay green. v1.5.0 shipped that way.
  #
  # pages.yml now owns Pages exclusively and picks this run up via `workflow_run`
  # once it completes — after the release is published, so releases/latest is
  # correct by then. That keeps the property this job existed for (a bot-created
  # release cannot fire pages.yml's `release` trigger) without the second source.
