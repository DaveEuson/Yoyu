name: Deploy setup page

# Publishes docs/ (the browser flasher + setup page) to GitHub Pages, and
# bundles the latest release firmware into the site so the flasher fetches it
# same-origin (GitHub's release-asset host sends no CORS header, so a
# cross-origin fetch from the Pages site is blocked -> "Failed to fetch").
#
# One-time repo setup: Settings -> Pages -> Source = "GitHub Actions".
#
# This is the ONLY workflow that deploys Pages. release.yml used to deploy too,
# with the firmware straight from its own build artifact, which meant two
# deployers reading two different sources: a docs push during a release would
# bundle the *previous* release's firmware (releases/latest lags until the
# release is published) and land after the release's own deploy. The flasher
# then installed the old version while the release page advertised the new one
# -- silently, because both runs were green. v1.5.0 shipped that way.
#
# A release published by the Actions bot does not fire the `release` trigger
# below (GITHUB_TOKEN events don't start workflows), which is why release.yml
# owned this in the first place. `workflow_run` is the trigger that does fire,
# and it runs after the release is published, so releases/latest is correct by
# then.

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  workflow_run:
    workflows: ["Build companion binaries"]   # release.yml
    types: [completed]
  release:
    types: [published]                        # a human publishing via the UI
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Queue deploys instead of cancelling them. Cancelling made the winner depend on
# who started last, which is the race described above; serialising means the
# post-release deploy always lands after a concurrent docs deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Skip a failed release build: its assets are absent or half-published, so
    # there is nothing new worth bundling.
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Bundle latest firmware images for the flasher (same-origin, no CORS)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base="https://github.com/${{ github.repository }}/releases/latest/download"
          # Record which release we are bundling, so the check below can tell
          # whether it moved under us.
          before=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName \
                     --jq .tagName 2>/dev/null || echo "")
          echo "bundling firmware from release: ${before:-<none>}"
          missing=0
          # Both boards. The setup page's board picker points esp-web-tools at
          # one manifest or the other, and a manifest whose parts were never
          # bundled 404s at Install time -- which looks to the buyer like the
          # board itself is broken. Whatever the picker can offer has to be here.
          for pfx in headroom-mini yoyu-amoled; do
            for part in bootloader partitions boot_app0 app; do
              f="$pfx-$part.bin"
              curl -fsSL -o "docs/firmware/$f" "$base/$f" || {
                echo "::warning::missing $f in latest release (flasher Install 404s for that board)"
                missing=1
              }
            done
          done
          echo "BUNDLED_TAG=${before}" >> "$GITHUB_ENV"
          echo "BUNDLE_INCOMPLETE=${missing}" >> "$GITHUB_ENV"
      - name: Refuse to publish a flasher that lags the current release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "${BUNDLED_TAG}" ]; then
            echo "No release exists yet — nothing to verify."; exit 0
          fi
          base="https://github.com/$GITHUB_REPOSITORY/releases/latest/download"
          after=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          if [ "$after" != "${BUNDLED_TAG}" ]; then
            # A release published while this job was downloading. Whatever is on
            # disk is the previous version; deploying it is exactly the bug this
            # guard exists to stop. The workflow_run deploy for that release will
            # follow and publish the right thing.
            echo "::error::releases/latest moved ${BUNDLED_TAG} -> ${after} mid-run; refusing to deploy stale firmware"
            exit 1
          fi
          if [ "${BUNDLE_INCOMPLETE}" = "1" ]; then
            echo "::warning::deploying with firmware images missing from $after"
            exit 0
          fi
          # The flasher must install exactly what the release ships; a mismatch
          # here is the silent failure that shipped with v1.5.0.
          # Checked per board: one correct image is no evidence about the
          # other, and the two are byte-for-byte different builds of the same
          # version.
          for pfx in headroom-mini yoyu-amoled; do
            curl -fsSL -o "/tmp/$pfx-release-app.bin" "$base/$pfx-app.bin"
            a=$(sha256sum "docs/firmware/$pfx-app.bin" | cut -d' ' -f1)
            b=$(sha256sum "/tmp/$pfx-release-app.bin" | cut -d' ' -f1)
            if [ "$a" != "$b" ]; then
              echo "::error::bundled $pfx-app.bin does not match $after ($a != $b)"
              exit 1
            fi
            echo "flasher matches $after for $pfx ($a)"
          done
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v5
