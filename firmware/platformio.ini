; Yoyu — firmware for the supported ESP32-S3 boards.
;
; Two boards ship. Pins and panel geometry live in src/boards.h, selected by the
; -DYOYU_BOARD_* flag below; nothing board-specific belongs in this file beyond
; that flag and whatever the toolchain itself needs to differ.
;
; Build:   pio run                        (both boards)
;          pio run -e headroom-mini       (just the 2" LCD)
;          pio run -e yoyu-amoled216      (just the 2.16" AMOLED)
; Flash:   pio run -e <env> -t upload     (board plugged in via USB-C)
; Monitor: pio device monitor

[env]
; Pinned: this project ships signed firmware, so the toolchain that produces a
; release must not change underneath it. Bump deliberately, not by surprise.
;
; pioarduino, not platformio/espressif32. The official platform never moved past
; Arduino core 2.0.17: its 7.1.3 still packages 2.0.17, four years on. Core 3.x
; is what an ESP32-C6 needs, and what GFX 1.5+ requires, so staying official
; means staying on two boards forever. pioarduino is the community continuation
; and tracks Espressif's own core releases.
;
; Pinned to one exact release by URL rather than a range, for the reason the
; version was pinned before: a signed build has to be reproducible, and this is
; now a third-party source.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
monitor_speed = 115200

; Only the flags every board shares. Flash size, PSRAM and the partition
; table are per-board now that not every board is an ESP32-S3.
build_flags =
    ; Serial over the native USB-C port
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

lib_deps =
    ; Was pinned at 1.4.9 because 1.5+ requires arduino-esp32 core 3.x. That is
    ; what the platform above now ships, so this moves to the current release.
    moononournation/GFX Library for Arduino@1.6.7
    bblanchon/ArduinoJson@^7.0.4

; What both ESP32-S3R8 boards need: 16MB QIO flash + 8MB octal PSRAM.
[s3r8]
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

; Waveshare ESP32-S3-Touch-LCD-2 — 2" ST7789 240x320 IPS, CST816D touch.
;
; The env name is FROZEN. release.yml reads .pio/build/headroom-mini/ by path
; and the release assets it produces are named from it; boards in the field
; fetch those exact names for OTA. Renaming this to match the product would
; strand every board already sold. The board it builds is identified by
; BOARD_SLUG in boards.h, not by this string.
[env:headroom-mini]
board = esp32-s3-devkitc-1
board_build.flash_size = ${s3r8.board_build.flash_size}
board_upload.flash_size = ${s3r8.board_upload.flash_size}
board_build.partitions = ${s3r8.board_build.partitions}
board_build.arduino.memory_type = ${s3r8.board_build.arduino.memory_type}
build_flags =
    ${s3r8.build_flags}
    -DYOYU_BOARD_LCD2

; Waveshare ESP32-S3-Touch-AMOLED-2.16 — CO5300 480x480 AMOLED over QSPI,
; CST9220 touch. New board, so its assets get the product's own name.
[env:yoyu-amoled216]
board = esp32-s3-devkitc-1
board_build.flash_size = ${s3r8.board_build.flash_size}
board_upload.flash_size = ${s3r8.board_upload.flash_size}
board_build.partitions = ${s3r8.board_build.partitions}
board_build.arduino.memory_type = ${s3r8.board_build.arduino.memory_type}
build_flags =
    ${s3r8.build_flags}
    -DYOYU_BOARD_AMOLED216

; Waveshare ESP32-C6-LCD-1.47 -- 1.47" ST7789 172x320, no touch, RGB LED.
; RISC-V, single core, no PSRAM, and 4MB of flash on the part Waveshare
; documents, which is why it carries its own partition table.
[env:yoyu-c6lcd147]
board = esp32-c6-devkitc-1
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = partitions-4mb-ota.csv
build_flags =
    ${env.build_flags}
    -DYOYU_BOARD_C6LCD147
; Touch diagnostics, off by default -- a release build must not spew the raw
; I2C frame to the console. Add them back to either env when investigating:
;   -DYOYU_TOUCH_PROBE   log every touch frame, changed or periodic
;   -DYOYU_TOUCH_NOINT   poll the chip instead of waiting on its interrupt
