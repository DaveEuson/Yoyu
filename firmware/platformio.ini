; Yoyu — firmware for the supported ESP32-S3 boards.
;
; Two boards ship. Pins and panel geometry live in src/boards.h, selected by the
; -DYOYU_BOARD_* flag below; nothing board-specific belongs in this file beyond
; that flag and whatever the toolchain itself needs to differ.
;
; Build:   pio run                        (both boards)
;          pio run -e headroom-mini       (just the 2" LCD)
;          pio run -e yoyu-amoled216      (just the 2.16" AMOLED)
; Flash:   pio run -e <env> -t upload     (board plugged in via USB-C)
; Monitor: pio device monitor

[env]
; Pinned: this project ships signed firmware, so the toolchain that produces a
; release must not change underneath it. Bump deliberately, not by surprise.
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; Both boards are ESP32-S3R8: 16MB QIO flash + 8MB octal PSRAM.
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

build_flags =
    -DBOARD_HAS_PSRAM
    ; Serial over the native USB-C port
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

lib_deps =
    ; pinned: 1.5+ requires arduino-esp32 core 3.x, but PlatformIO's
    ; espressif32 platform ships core 2.x (missing esp32-hal-periman.h)
    moononournation/GFX Library for Arduino@1.4.9
    bblanchon/ArduinoJson@^7.0.4

; Waveshare ESP32-S3-Touch-LCD-2 — 2" ST7789 240x320 IPS, CST816D touch.
;
; The env name is FROZEN. release.yml reads .pio/build/headroom-mini/ by path
; and the release assets it produces are named from it; boards in the field
; fetch those exact names for OTA. Renaming this to match the product would
; strand every board already sold. The board it builds is identified by
; BOARD_SLUG in boards.h, not by this string.
[env:headroom-mini]
build_flags =
    ${env.build_flags}
    -DYOYU_BOARD_LCD2

; Waveshare ESP32-S3-Touch-AMOLED-2.16 — CO5300 480x480 AMOLED over QSPI,
; CST9220 touch. New board, so its assets get the product's own name.
[env:yoyu-amoled216]
build_flags =
    ${env.build_flags}
    -DYOYU_BOARD_AMOLED216
; Touch diagnostics, off by default -- a release build must not spew the raw
; I2C frame to the console. Add them back to either env when investigating:
;   -DYOYU_TOUCH_PROBE   log every touch frame, changed or periodic
;   -DYOYU_TOUCH_NOINT   poll the chip instead of waiting on its interrupt
